; PlatformIO Project Configuration File for ESP32-S3 Super Mini + ST7789 (240x280)
; PVE 8.1.4 Dashboard Monitor

[platformio]
default_envs = esp32-s3-supermini

[env:esp32-s3-supermini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3FH4R2 硬件参数: 240MHz 双核 Xtensa LX7, 4MB Flash, 2MB Quad-SPI PSRAM
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_qspi

build_flags = 
    -specs=no_asm_inc.specs
    ; 启用 2MB PSRAM 支持
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

    ; TFT_eSPI 驱动免侵入配置 (标准 ST7789 240x320, 横屏旋转后为 320x240)
    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_INVERSION_ON=1

    ; ESP32-S3 Super Mini 推荐 SPI 引脚映射 (侧边排针安全 GPIO)
    -D TFT_MOSI=5
    -D TFT_SCLK=7
    -D TFT_CS=4
    -D TFT_DC=6
    -D TFT_RST=1
    -D TFT_BL=2
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

    ; LVGL 7 配置
    -D LV_LVGL_H_INCLUDE_SIMPLE=1
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I include
    -I src
    -I src/fonts

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@~7.11.0
    bblanchon/ArduinoJson@^6.21.4

